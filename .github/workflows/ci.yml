name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Parse Python sources
        run: python -m compileall -q app.py backend ui pages scripts tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Build source-only deployment archive
        run: python scripts/package_deployment.py
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-source
          path: deploy-dist/VBAS-deploy.zip
